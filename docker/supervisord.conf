[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:apache]
command=/usr/local/bin/apache2-foreground
priority=10
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:migrations]
command=/bin/sh /var/www/html/docker/run-migrations.sh
directory=/var/www/html
user=www-data
priority=15
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:queue]
command=/bin/sh /var/www/html/docker/run-queue.sh
directory=/var/www/html
user=www-data
priority=20
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=130
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:scheduler]
command=/bin/sh /var/www/html/docker/run-scheduler.sh
directory=/var/www/html
user=www-data
priority=30
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
