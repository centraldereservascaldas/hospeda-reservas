name: Release image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and check types
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          extensions: ctype, mbstring, openssl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Verify PHP version
        run: test "$(php -r 'echo PHP_VERSION;')" = '8.5.12'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run backend tests
        run: php artisan test --compact

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hospeda_test
          POSTGRES_USER: hospeda_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospeda_test -d hospeda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: hospeda_test
      DB_USERNAME: hospeda_test
      DB_PASSWORD: ci-only-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          extensions: ctype, mbstring, openssl, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Verify PHP version
        run: test "$(php -r 'echo PHP_VERSION;')" = '8.5.12'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PostgreSQL migration compatibility test
        run: php artisan test --compact tests/Feature/GatewayProviderMigrationTest.php

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag hospeda-reservas:release-smoke .

      - name: Check application health
        env:
          CONTAINER_NAME: hospeda-reservas-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          app_key="base64:$(openssl rand -base64 32)"

          docker run --detach \
            --name "$CONTAINER_NAME" \
            --publish 127.0.0.1:8080:80 \
            --env "APP_KEY=$app_key" \
            --env APP_ENV=production \
            --env APP_DEBUG=false \
            --env DB_CONNECTION=sqlite \
            --env DB_DATABASE=/var/www/html/database/database.sqlite \
            hospeda-reservas:release-smoke

          deadline=$((SECONDS + 180))
          until [ "$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || true)" = healthy ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              docker logs "$CONTAINER_NAME"
              docker inspect --format '{{json .State.Health}}' "$CONTAINER_NAME"
              exit 1
            fi

            sleep 2
          done

          docker exec "$CONTAINER_NAME" test -f /tmp/hospeda-migrations-ready
          docker exec "$CONTAINER_NAME" supervisorctl status apache migrations queue scheduler | tee /tmp/hospeda-release-supervisor.txt
          test "$(grep -c RUNNING /tmp/hospeda-release-supervisor.txt)" -eq 4

          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/health | grep --fixed-strings '"success":true'
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/ready | grep --fixed-strings '"success":true'
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/ --output /tmp/hospeda-smoke-index.html
          grep --fixed-strings '<div id="root">' /tmp/hospeda-smoke-index.html
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/sitemap.xml --output /tmp/hospeda-smoke-sitemap.xml
          python3 -c 'import xml.etree.ElementTree as ET; root = ET.parse("/tmp/hospeda-smoke-sitemap.xml").getroot(); assert root.tag == "{http://www.sitemaps.org/schemas/sitemap/0.9}urlset" and len(root) > 0'


          app_asset=$(sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' /tmp/hospeda-smoke-index.html | head -n 1)
          test -n "$app_asset"
          curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:8080$app_asset" --output /dev/null

      - name: Remove smoke container
        if: always()
        env:
          CONTAINER_NAME: hospeda-reservas-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$CONTAINER_NAME" 2>/dev/null || true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - frontend
      - backend
      - postgres-migrations
      - container-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate advertising measurement configuration
        env:
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
        run: |
          set -euo pipefail
          test -n "$VITE_GTM_ID"
          [[ "$VITE_GTM_ID" =~ ^GTM-[A-Z0-9]+$ ]]
          test -n "$VITE_GA_ID"
          [[ "$VITE_GA_ID" =~ ^G-[A-Z0-9]+$ ]]

      - name: Validate account configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL"
          [[ "$VITE_SUPABASE_URL" =~ ^https://[a-z0-9-]+\.supabase\.co/?$ ]]
          test -n "$VITE_SUPABASE_ANON_KEY"

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_GTM_ID=${{ vars.VITE_GTM_ID }}
            VITE_GA_ID=${{ vars.VITE_GA_ID }}
            VITE_MERCADO_PAGO_PUBLIC_KEY=${{ vars.VITE_MERCADO_PAGO_PUBLIC_KEY }}

      - name: Smoke test the published image by digest
        env:
          CONTAINER_NAME: hospeda-reservas-published-${{ github.run_id }}-${{ github.run_attempt }}
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail

          image_ref="$IMAGE@$DIGEST"
          app_key="base64:$(openssl rand -base64 32)"

          docker pull "$image_ref"
          docker run --detach \
            --name "$CONTAINER_NAME" \
            --publish 127.0.0.1:8080:80 \
            --env "APP_KEY=$app_key" \
            --env APP_ENV=production \
            --env APP_DEBUG=false \
            --env DB_CONNECTION=sqlite \
            --env DB_DATABASE=/var/www/html/database/database.sqlite \
            "$image_ref"

          deadline=$((SECONDS + 180))
          until [ "$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || true)" = healthy ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              docker logs "$CONTAINER_NAME"
              docker inspect --format '{{json .State.Health}}' "$CONTAINER_NAME"
              exit 1
            fi

            sleep 2
          done

          docker exec "$CONTAINER_NAME" test -f /tmp/hospeda-migrations-ready
          docker exec "$CONTAINER_NAME" supervisorctl status apache migrations queue scheduler | tee /tmp/hospeda-published-supervisor.txt
          test "$(grep -c RUNNING /tmp/hospeda-published-supervisor.txt)" -eq 4

          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/health | grep --fixed-strings '"success":true'
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/ready | grep --fixed-strings '"success":true'
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/ --output /tmp/hospeda-published-index.html
          grep --fixed-strings '<div id="root">' /tmp/hospeda-published-index.html

          app_asset=$(sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' /tmp/hospeda-published-index.html | head -n 1)
          test -n "$app_asset"
          curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:8080$app_asset" --output /dev/null

      - name: Remove published image smoke container
        if: always()
        env:
          CONTAINER_NAME: hospeda-reservas-published-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$CONTAINER_NAME" 2>/dev/null || true

      - name: Record immutable image reference
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo '### Published image'
            echo
            echo "- Commit tag: \`$IMAGE:${GITHUB_SHA}\`"
            echo "- Immutable digest: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Update Coolify image tag and deploy
        env:
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -n "$COOLIFY_APPLICATION_UUID"
          test -n "$COOLIFY_TOKEN"
          [[ "$COOLIFY_APPLICATION_UUID" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

          api_base="https://cy.caldasindica.com/api/v1"
          application_url="$api_base/applications/$COOLIFY_APPLICATION_UUID"

          application_envs=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$application_url/envs")

          upsert_runtime_env() {
            local key="$1" value="$2" method payload
            if jq --exit-status --arg key "$key" \
              'any(.[]; .key == $key and .is_preview == false)' \
              <<< "$application_envs" >/dev/null; then
              method='PATCH'
            else
              method='POST'
            fi
            payload=$(jq --null-input --compact-output \
              --arg key "$key" \
              --arg value "$value" \
              '{key: $key, value: $value, is_preview: false, is_literal: true}')
            curl --fail-with-body --silent --show-error \
              --request "$method" \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              "$application_url/envs" \
              --output /dev/null
          }

          upsert_runtime_env STAYS_HOSTED_CHECKOUT_ENABLED true
          upsert_runtime_env STAYS_HOSTED_CHECKOUT_ALLOWED_HOSTS 'www.centraldereservascaldas.com.br,centraldereservascaldas.com.br'
          upsert_runtime_env PARK_TICKETS_PREVIEW_ENABLED false

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"docker_registry_image_tag\":\"$IMAGE_TAG\"}" \
            "$application_url" \
            --output /dev/null

          deployment_response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$api_base/deploy?uuid=$COOLIFY_APPLICATION_UUID")
          deployment_uuid=$(jq --raw-output --exit-status '.deployments[0].deployment_uuid // empty' <<< "$deployment_response")
          test -n "$deployment_uuid"

          deadline=$((SECONDS + 1500))
          while [ "$SECONDS" -lt "$deadline" ]; do
            deployment=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              "$api_base/deployments/$deployment_uuid")
            status=$(jq --raw-output '.status // empty' <<< "$deployment")

            case "$status" in
              finished)
                application=$(curl --fail-with-body --silent --show-error \
                  --header "Authorization: Bearer $COOLIFY_TOKEN" \
                  "$application_url")
                deployed_tag=$(jq --raw-output '.docker_registry_image_tag // empty' <<< "$application")
                application_status=$(jq --raw-output '.status // empty' <<< "$application")
                if [ "$deployed_tag" != "$IMAGE_TAG" ]; then
                  echo 'Coolify finished with an unexpected image tag.' >&2
                  exit 1
                fi
                if [ "$application_status" != 'running:healthy' ]; then
                  echo "Waiting for container health: $application_status"
                  sleep 10
                  continue
                fi
                echo "Coolify deployed healthy image tag $IMAGE_TAG."
                break
                ;;
              failed|cancelled|cancelled-by-user)
                echo "Coolify deployment ended with status: $status" >&2
                exit 1
                ;;
              '')
                echo 'Coolify response did not include a deployment status.' >&2
                exit 1
                ;;
            esac

            sleep 10
          done

          if [ "${status:-}" != 'finished' ] || [ "${application_status:-}" != 'running:healthy' ]; then
            echo 'Timed out waiting for the Coolify deployment to finish.' >&2
            exit 1
          fi

      - name: Verify the public checkout deployment
        env:
          DIRECT_CHECKOUT_EXPECTED_ENABLED: ${{ vars.DIRECT_CHECKOUT_EXPECTED_ENABLED || 'false' }}
        run: |
          set -euo pipefail

          if [ "$DIRECT_CHECKOUT_EXPECTED_ENABLED" != 'true' ] && [ "$DIRECT_CHECKOUT_EXPECTED_ENABLED" != 'false' ]; then
            echo 'DIRECT_CHECKOUT_EXPECTED_ENABLED must be true or false.' >&2
            exit 1
          fi

          base_url='https://crcn.caldasindica.com'
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            health=$(curl --fail --silent --show-error --max-time 15 "$base_url/api/health" || true)
            stays=$(curl --fail --silent --show-error --max-time 15 "$base_url/api/stays/status" || true)
            checkout=$(curl --fail --silent --show-error --max-time 15 "$base_url/api/stays-checkout/readiness" || true)
            direct_checkout=$(curl --fail --silent --show-error --max-time 15 "$base_url/api/checkout/readiness/LG02J" || true)

            direct_checkout_matches_expected=false
            if [ "$DIRECT_CHECKOUT_EXPECTED_ENABLED" = 'true' ]; then
              if jq --exit-status '.ready == true and .checkoutEnabled == true and .singlePageCheckoutEnabled == true and .payment.enabled == true and (.payment.methods | index("card")) != null and (.payment.methods | index("pix")) != null' <<< "$direct_checkout" >/dev/null 2>&1; then
                direct_checkout_matches_expected=true
              fi
            elif jq --exit-status '.success == true and .ready == false and .checkoutEnabled == false and .singlePageCheckoutEnabled == false and .payment.enabled == false' <<< "$direct_checkout" >/dev/null 2>&1; then
              direct_checkout_matches_expected=true
            fi

            if jq --exit-status '.success == true' <<< "$health" >/dev/null 2>&1 \
              && jq --exit-status '.connected == true and .hasCredentials == true and .environment == "production"' <<< "$stays" >/dev/null 2>&1 \
              && jq --exit-status '.ready == true and .code == null' <<< "$checkout" >/dev/null 2>&1 \
              && [ "$direct_checkout_matches_expected" = true ]; then
              curl --fail --silent --show-error --max-time 15 \
                --dump-header /tmp/hospeda-public-headers.txt \
                --output /dev/null \
                "$base_url/"
              grep --ignore-case --fixed-strings 'x-content-type-options: nosniff' /tmp/hospeda-public-headers.txt
              grep --ignore-case --fixed-strings 'x-frame-options: DENY' /tmp/hospeda-public-headers.txt
              grep --ignore-case --fixed-strings 'strict-transport-security: max-age=31536000' /tmp/hospeda-public-headers.txt
              if grep --ignore-case --quiet '^x-powered-by:' /tmp/hospeda-public-headers.txt; then
                echo 'The public response still exposes X-Powered-By.' >&2
                exit 1
              fi
              echo "Public domain is healthy; direct checkout matches expected enabled state: $DIRECT_CHECKOUT_EXPECTED_ENABLED."
              exit 0
            fi

            sleep 10
          done

          echo "The public domain did not reach the expected direct checkout state: $DIRECT_CHECKOUT_EXPECTED_ENABLED." >&2
          exit 1
