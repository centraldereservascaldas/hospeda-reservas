name: Publish production image

on:
  push:
    branches:
      - codex/hospeda-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and check types
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, mbstring, openssl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run backend tests
        run: php artisan test --compact

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag hospeda-reservas:release-smoke .

      - name: Check application health
        env:
          CONTAINER_NAME: hospeda-reservas-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          app_key="base64:$(openssl rand -base64 32)"

          docker run --detach \
            --name "$CONTAINER_NAME" \
            --publish 127.0.0.1:8080:80 \
            --env "APP_KEY=$app_key" \
            --env APP_ENV=production \
            --env APP_DEBUG=false \
            --env DB_CONNECTION=sqlite \
            --env DB_DATABASE=/tmp/container-smoke.sqlite \
            hospeda-reservas:release-smoke

          deadline=$((SECONDS + 180))
          until [ "$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || true)" = healthy ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              docker logs "$CONTAINER_NAME"
              docker inspect --format '{{json .State.Health}}' "$CONTAINER_NAME"
              exit 1
            fi

            sleep 2
          done

          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/health | grep --fixed-strings '"success":true'
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/ready | grep --fixed-strings '"success":true'

      - name: Remove smoke container
        if: always()
        env:
          CONTAINER_NAME: hospeda-reservas-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$CONTAINER_NAME" 2>/dev/null || true

  publish:
    needs:
      - frontend
      - backend
      - container-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_GTM_ID=${{ vars.VITE_GTM_ID }}
            VITE_MERCADO_PAGO_PUBLIC_KEY=${{ vars.VITE_MERCADO_PAGO_PUBLIC_KEY }}
