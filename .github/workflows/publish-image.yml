name: Publish production image

on:
  push:
    branches:
      - codex/hospeda-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and check types
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, mbstring, openssl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run backend tests
        run: php artisan test --compact

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag hospeda-reservas:release-smoke .

      - name: Check application health
        env:
          CONTAINER_NAME: hospeda-reservas-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          app_key="base64:$(openssl rand -base64 32)"

          docker run --detach \
            --name "$CONTAINER_NAME" \
            --publish 127.0.0.1:8080:80 \
            --env "APP_KEY=$app_key" \
            --env APP_ENV=production \
            --env APP_DEBUG=false \
            --env DB_CONNECTION=sqlite \
            --env DB_DATABASE=/var/www/html/database/database.sqlite \
            hospeda-reservas:release-smoke

          deadline=$((SECONDS + 180))
          until [ "$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || true)" = healthy ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              docker logs "$CONTAINER_NAME"
              docker inspect --format '{{json .State.Health}}' "$CONTAINER_NAME"
              exit 1
            fi

            sleep 2
          done

          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/health | grep --fixed-strings '"success":true'
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/ready | grep --fixed-strings '"success":true'

      - name: Remove smoke container
        if: always()
        env:
          CONTAINER_NAME: hospeda-reservas-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$CONTAINER_NAME" 2>/dev/null || true

  publish:
    if: github.ref == 'refs/heads/codex/hospeda-production'
    needs:
      - frontend
      - backend
      - container-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_GTM_ID=${{ vars.VITE_GTM_ID }}
            VITE_MERCADO_PAGO_PUBLIC_KEY=${{ vars.VITE_MERCADO_PAGO_PUBLIC_KEY }}

  deploy:
    if: github.ref == 'refs/heads/codex/hospeda-production'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Update Coolify image tag and start deployment
        env:
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -n "$COOLIFY_APPLICATION_UUID"
          test -n "$COOLIFY_TOKEN"
          [[ "$COOLIFY_APPLICATION_UUID" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

          api_base="https://cy.caldasindica.com/api/v1"
          application_url="$api_base/applications/$COOLIFY_APPLICATION_UUID"

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"docker_registry_image_tag\":\"$IMAGE_TAG\"}" \
            "$application_url" \
            --output /dev/null

          deployment_response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$api_base/deploy?uuid=$COOLIFY_APPLICATION_UUID")

          deployment_uuid=$(jq --raw-output --exit-status '.deployments[0].deployment_uuid // empty' <<< "$deployment_response")
          test -n "$deployment_uuid"

          deadline=$((SECONDS + 1500))
          while [ "$SECONDS" -lt "$deadline" ]; do
            deployment=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              "$api_base/deployments/$deployment_uuid")
            status=$(jq --raw-output '.status // empty' <<< "$deployment")
            deployed_tag=$(jq --raw-output '.docker_registry_image_tag // empty' <<< "$deployment")

            case "$status" in
              finished)
                if [ "$deployed_tag" != "$IMAGE_TAG" ]; then
                  echo 'Coolify reported success for a different image tag.' >&2
                  exit 1
                fi

                echo "Coolify deployment finished for image tag $IMAGE_TAG."
                exit 0
                ;;
              failed|cancelled|cancelled-by-user)
                echo "Coolify deployment ended with status: $status" >&2
                exit 1
                ;;
              '')
                echo 'Coolify response did not include a deployment status.' >&2
                exit 1
                ;;
            esac

            sleep 10
          done

          echo 'Timed out waiting for the Coolify deployment to finish.' >&2
          exit 1
