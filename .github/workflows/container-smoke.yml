name: Container smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag hospeda-reservas:smoke .

      - name: Check healthy and unhealthy readiness
        env:
          CONTAINER_NAME: hospeda-reservas-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          UNREADY_CONTAINER_NAME: hospeda-reservas-unready-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          app_key="base64:$(openssl rand -base64 32)"

          docker run --detach \
            --name "$CONTAINER_NAME" \
            --publish 127.0.0.1:8080:80 \
            --env "APP_KEY=$app_key" \
            --env APP_ENV=production \
            --env APP_DEBUG=false \
            --env DB_CONNECTION=sqlite \
            --env DB_DATABASE=/tmp/container-smoke.sqlite \
            hospeda-reservas:smoke

          deadline=$((SECONDS + 180))
          until [ "$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || true)" = healthy ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              docker logs "$CONTAINER_NAME"
              docker inspect --format '{{json .State.Health}}' "$CONTAINER_NAME"
              exit 1
            fi

            sleep 2
          done

          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/health | grep --fixed-strings '"success":true'
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/ready | grep --fixed-strings '"success":true'

          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/ --output /tmp/hospeda-index.html
          grep --fixed-strings '<div id="root"></div>' /tmp/hospeda-index.html
          app_asset=$(sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' /tmp/hospeda-index.html | head -n 1)
          test -n "$app_asset"
          curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:8080$app_asset" --output /dev/null

          docker run --detach \
            --name "$UNREADY_CONTAINER_NAME" \
            --publish 127.0.0.1:8081:80 \
            --health-interval=2s \
            --health-timeout=5s \
            --health-start-period=15s \
            --health-retries=2 \
            --env "APP_KEY=$app_key" \
            --env APP_ENV=production \
            --env APP_DEBUG=false \
            --env DB_CONNECTION=pgsql \
            --env DB_HOST=127.0.0.1 \
            --env DB_PORT=1 \
            --env DB_DATABASE=unavailable \
            hospeda-reservas:smoke

          deadline=$((SECONDS + 90))
          until [ "$(docker inspect --format '{{.State.Health.Status}}' "$UNREADY_CONTAINER_NAME" 2>/dev/null || true)" = unhealthy ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              docker logs "$UNREADY_CONTAINER_NAME"
              docker inspect --format '{{json .State.Health}}' "$UNREADY_CONTAINER_NAME"
              exit 1
            fi

            sleep 2
          done

          health_status=$(curl --silent --max-time 10 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/api/health)
          ready_status=$(curl --silent --max-time 10 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/api/ready)

          test "$health_status" = 200
          test "$ready_status" = 503

      - name: Remove smoke containers
        if: always()
        env:
          CONTAINER_NAME: hospeda-reservas-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          UNREADY_CONTAINER_NAME: hospeda-reservas-unready-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$CONTAINER_NAME" "$UNREADY_CONTAINER_NAME" 2>/dev/null || true
